services:
  browserless:
    image: browserless/chrome:latest
    container_name: automation-browserless
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=3
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromium:
    image: selenium/standalone-chromium:latest
    container_name: automation-chromium
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:7900:7900"
    environment:
      - SE_VNC_NO_PASSWORD=1
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 30s
      timeout: 10s
      retries: 3
